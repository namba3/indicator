[package]
name = "indicator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A no_std-compatible Rust library for technical analysis indicators."
readme = "README.md"
repository = "https://github.com/namba3/indicator"
authors = ["namba3 (GitHub: @namba3)"]
license = "MIT OR Apache-2.0"

[[example]]
name = "basic"
path = "./example/basic.rs"

[[bench]]
name = "indicators"
path = "benches/indicators.rs"
harness = false

[features]
default = ["std"]
std = []
stream = ["dep:futures-core"]

[dependencies]
futures-core = { version = "0.3.34", optional = true, default-features = false }
libm = "0.2.16"

[dev-dependencies]
rand = "0.10.3"
futures-executor = "0.3.34"
futures-util = "0.3.34"
